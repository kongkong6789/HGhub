name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 NDK 与构建工具
        shell: bash
        run: |
          set -e
          echo "SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0" || true
          ls "$ANDROID_SDK_ROOT/ndk" || true
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | tail -1)
          echo "选用 NDK: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_PATH=$NDK_DIR" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-build

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 Android 工程
        run: pnpm tauri android init --ci

      - name: 生成签名证书并注入签名配置
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/hghub.jks" -alias hghub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hghub123456 -keypass hghub123456 \
            -dname "CN=HGhub,OU=Dev,O=HGhub,L=SZ,ST=GD,C=CN"
          cat >> src-tauri/gen/android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("KEYSTORE_PATH")!!)
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: 构建 release APK（按 ABI 分包）
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/hghub.jks
          KEYSTORE_PASSWORD: hghub123456
          KEY_ALIAS: hghub
          KEY_PASSWORD: hghub123456
        run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: 列出产物
        run: find src-tauri/gen/android/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
